<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="270" fill="#ffffff"/>

  <!-- Capture: next -->
  <rect x="30" y="40" width="180" height="120" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="120" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Capture</text>
  <text x="120" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">NEXT</text>
  <text x="120" y="124" text-anchor="middle" font-size="13" fill="#374151">URLs, PDFs, notes</text>
  <text x="120" y="142" text-anchor="middle" font-size="13" fill="#374151">later: video and audio</text>

  <!-- Distill: works -->
  <rect x="250" y="40" width="180" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Distill</text>
  <text x="340" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">WORKS</text>
  <text x="340" y="124" text-anchor="middle" font-size="13" fill="#374151">key ideas, anchor phrase,</text>
  <text x="340" y="142" text-anchor="middle" font-size="13" fill="#374151">core idea, injection flag</text>

  <!-- Organize: in progress -->
  <rect x="470" y="40" width="180" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Organize</text>
  <text x="560" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">IN PROGRESS</text>
  <text x="560" y="124" text-anchor="middle" font-size="13" fill="#374151">into my own projects,</text>
  <text x="560" y="142" text-anchor="middle" font-size="13" fill="#374151">areas and resources</text>

  <!-- Return: planned -->
  <rect x="690" y="40" width="180" height="120" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="780" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Return</text>
  <text x="780" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">PLANNED</text>
  <text x="780" y="124" text-anchor="middle" font-size="13" fill="#374151">answers that cite</text>
  <text x="780" y="142" text-anchor="middle" font-size="13" fill="#374151">their sources</text>

  <!-- arrows -->
  <line x1="212" y1="100" x2="246" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="432" y1="100" x2="466" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="100" x2="686" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M780,162 L780,215 L120,215 L120,166" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="300" y="236" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="248" font-size="12.5" fill="#374151">works</text>
  <rect x="385" y="236" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="405" y="248" font-size="12.5" fill="#374151">in progress</text>
  <rect x="500" y="236" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="520" y="248" font-size="12.5" fill="#374151">next / planned</text>
</svg>
